# nginx site for AI Crop Health.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/crophealth
#   sudo ln -sf /etc/nginx/sites-available/crophealth /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file to add the TLS block:
#   sudo certbot --nginx -d YOUR_DOMAIN

upstream crophealth_app {
    server unix:/run/crophealth/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Farmer photos arrive straight from a phone camera. The Django view
    # compresses them, but the upload itself has to fit through nginx first,
    # and the default 1MB would reject most phone photos with a bare 413.
    client_max_body_size 12M;

    # Diagnosis and chatbot requests wait on third-party APIs.
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    # Uploaded images: served straight off disk, never through Python.
    location /media/ {
        alias /srv/crophealth/media/;
        expires 30d;
        add_header Cache-Control "public";
        # Uploaded files must never be executed or sniffed into something else.
        add_header X-Content-Type-Options "nosniff";
    }

    # WhiteNoise can serve static itself, but letting nginx do it saves a
    # Python process on every CSS and image request.
    location /static/ {
        alias /srv/crophealth/AI_Crop_Health/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this to know the original request was HTTPS; without it
        # SECURE_SSL_REDIRECT loops forever behind the proxy.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://crophealth_app;
    }
}
